# Render blueprint — KARMA backend.
#
# Purpose: on every deployment, run Prisma migrations + seed BEFORE the app
# starts. This makes "code ahead of database" impossible — the exact class of
# outage we hit when new columns/enums were added but the live DB was never
# migrated.
#
# IMPORTANT — Render cannot reach the Supabase DIRECT connection.
# Supabase's direct host `db.<ref>.supabase.co:5432` is IPv6-only, and Render
# has no outbound IPv6 (Supabase lists Render as IPv6-incompatible). Using the
# direct string here causes P1001 "Can't reach database server".
#
# Use the Supavisor pooler host instead (Supabase dashboard → Connect):
#   DATABASE_URL = Supavisor session pooler, port 5432
#     postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   DIRECT_URL   = the same session-pooler string (prisma migrate deploy runs
#                  through it; migrations work in session mode, NOT in
#                  transaction mode on port 6543)
#   SUPABASE_URL  = https://<ref>.supabase.co
#   SUPABASE_JWT_SECRET = your HS256 secret
#   CORS_ORIGIN   = comma-separated allowed origins (e.g. your Vercel URL)
#   NODE_ENV      = production
#
# If you prefer transaction mode for the app (port 6543), keep DIRECT_URL on
# session mode: set DATABASE_URL to ...:6543/postgres?pgbouncer=true&connection_limit=1
# and leave DIRECT_URL on ...:5432 for migrations.
#
# The password must be URL-encoded (@ → %40, # → %23, / → %2F, etc.).

services:
  - type: web
    name: karma-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: |-
      npm ci
      npx prisma generate
      npm run build
      npm run db:deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Do not hardcode PORT: Render injects its own PORT at runtime.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false